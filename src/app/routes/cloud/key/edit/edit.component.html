@if (formData() === null) {
  <nz-spin nzSimple class="block py-lg text-center" />
} @else {
  @if (editable) {
    <p class="text-grey mb-md">
      创建于 {{ createdAt() | date: 'yyyy-MM-dd HH:mm:ss' }}　·　 更新于
      {{ updatedAt() | date: 'yyyy-MM-dd HH:mm:ss' }}
    </p>
  }
  <sf #sf [schema]="schema" [ui]="ui" [formData]="formData()!" button="none">
    <div class="text-right pt-md">
      <button nz-button type="button" (click)="close()">取消</button>
      <button
        nz-button
        type="button"
        nzType="primary"
        (click)="save(sf.value)"
        [disabled]="!sf.valid"
      >
        {{ editable ? '保存' : '创建' }}
      </button>
    </div>
  </sf>
}

@if (formData() === null) {
  <nz-spin nzSimple class="block py-lg text-center" />
} @else {
  <div nz-row nzJustify="center">
    <div nz-col nzXs="24" nzMd="20" nzLg="16" nzXl="12">
      <sf #sf mode="edit" [schema]="schema" [ui]="ui" [formData]="formData()!" button="none">
        <div class="text-center">
          <button
            nz-button
            type="button"
            nzType="primary"
            nzSize="large"
            [nzLoading]="saving()"
            [disabled]="!sf.valid || saving()"
            (click)="save(sf.value)"
          >
            修改
          </button>
          <button nz-button type="button" nzSize="large" routerLink="/home">返回首页</button>
        </div>
      </sf>
    </div>
  </div>
}

@if (sent()) {
  <nz-result nzStatus="success" nzTitle="请激活新邮箱">
    <div nz-result-content>
      新邮箱激活邮件已发送到 {{ email() }}，邮件有效期为 30
      分钟。请及时登录新邮箱，点击邮件中的链接激活账号；激活前原邮箱仍然有效。
    </div>
    <div nz-result-extra>
      <button nz-button type="button" nzType="primary" nzSize="large" routerLink="/dashboard">
        返回首页
      </button>
    </div>
  </nz-result>
} @else {
  <div nz-row nzJustify="center">
    <div nz-col nzXs="24" nzMd="20" nzLg="16" nzXl="12">
      @if (message()) {
        <nz-alert nzType="error" [nzMessage]="message()" [nzShowIcon]="true" class="mb-lg" />
      }
      <sf #sf mode="edit" [schema]="schema" [ui]="ui" [formData]="formData()" button="none">
        <div class="text-center">
          <button
            nz-button
            type="button"
            nzType="primary"
            nzSize="large"
            [nzLoading]="saving()"
            [disabled]="!sf.valid || saving()"
            (click)="submit(sf.value)"
          >
            更换
          </button>
          <button nz-button type="button" nzSize="large" routerLink="/dashboard">返回首页</button>
        </div>
      </sf>
    </div>
  </div>
}

<div nz-row nzJustify="center">
  <div nz-col nzXs="24" nzMd="20" nzLg="16" nzXl="12">
    <nz-alert
      nzType="info"
      [nzShowIcon]="true"
      class="mb-lg"
      nzMessage="密码需为 8-64 位且同时包含字母和数字；修改成功后其它设备上的登录会被强制退出，当前设备保持登录。"
    />
    @if (error()) {
      <nz-alert nzType="error" [nzMessage]="error()" [nzShowIcon]="true" class="mb-lg" />
    }
    <form nz-form [formGroup]="form" (ngSubmit)="submit()" role="form">
      <nz-form-item>
        <nz-form-control nzErrorTip="请输入当前密码！">
          <nz-input-wrapper>
            <nz-icon nzInputPrefix nzType="lock" />
            <input
              nz-input
              nzSize="large"
              type="password"
              formControlName="oldPassword"
              autocomplete="current-password"
              placeholder="当前密码"
            />
          </nz-input-wrapper>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control [nzErrorTip]="newErrorTip">
          <nz-input-wrapper>
            <nz-icon nzInputPrefix nzType="lock" />
            <input
              nz-input
              nzSize="large"
              type="password"
              formControlName="newPassword"
              autocomplete="new-password"
              placeholder="新密码（8-64 位，含字母与数字）"
            />
          </nz-input-wrapper>
          <ng-template #newErrorTip let-i>
            @if (i.errors?.required) {
              请输入新密码！
            }
            @if (i.errors?.minlength || i.errors?.maxlength) {
              密码长度为 8-64 位！
            }
            @if (i.errors?.password) {
              密码必须同时包含字母和数字！
            }
          </ng-template>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control [nzErrorTip]="confirmErrorTip">
          <nz-input-wrapper>
            <nz-icon nzInputPrefix nzType="lock" />
            <input
              nz-input
              nzSize="large"
              type="password"
              formControlName="confirm"
              autocomplete="new-password"
              placeholder="确认新密码"
            />
          </nz-input-wrapper>
          <ng-template #confirmErrorTip let-i>
            @if (i.errors?.required) {
              请再次输入新密码！
            }
            @if (i.errors?.matchControl) {
              两次输入的密码不一致！
            }
          </ng-template>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <div class="text-center">
          <button
            nz-button
            type="submit"
            nzType="primary"
            nzSize="large"
            [nzLoading]="loading()"
            [disabled]="loading()"
          >
            保存
          </button>
          <button nz-button type="button" nzSize="large" routerLink="/dashboard">返回首页</button>
        </div>
      </nz-form-item>
    </form>
  </div>
</div>

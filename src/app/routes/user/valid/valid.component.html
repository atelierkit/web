<div class="user-form">
  <nz-alert
    nzType="info"
    [nzShowIcon]="true"
    class="mb-lg"
    nzMessage="有效期为「多久不访问就失效」，保存后立即生效，并作为下次登录的默认有效期。"
  />
  <sf #sf mode="edit" [schema]="schema" [ui]="ui" [formData]="formData()" button="none">
    <div class="text-center">
      <button
        nz-button
        type="button"
        nzType="primary"
        nzSize="large"
        [nzLoading]="saving()"
        [disabled]="!sf.valid || saving()"
        (click)="save(sf.value)"
      >
        保存
      </button>
      <button nz-button type="button" nzSize="large" routerLink="/home">返回首页</button>
    </div>
  </sf>
</div>

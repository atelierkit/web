<form nz-form [formGroup]="form" (ngSubmit)="submit()" role="form">
  <h3>用户名密码登录</h3>
  @if (error) {
    <nz-alert nzType="error" [nzMessage]="error" [nzShowIcon]="true" class="mb-lg" />
  }
  <nz-form-item>
    <nz-form-control [nzErrorTip]="usernameErrorTip">
      <nz-input-wrapper>
        <nz-icon nzInputPrefix nzType="user" />
        <input
          nz-input
          nzSize="large"
          formControlName="username"
          autocomplete="username"
          placeholder="用户名"
        />
      </nz-input-wrapper>
      <ng-template #usernameErrorTip let-i>
        @if (i.errors?.required) {
          请输入用户名！
        }
        @if (i.errors?.pattern) {
          用户名为 3-20 位字母、数字、下划线或短横线！
        }
      </ng-template>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-control nzErrorTip="请输入密码！">
      <nz-input-wrapper>
        <nz-icon nzInputPrefix nzType="lock" />
        <input
          nz-input
          nzSize="large"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="密码"
        />
      </nz-input-wrapper>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <button nz-button type="submit" nzType="primary" nzSize="large" [nzLoading]="loading" nzBlock>
      登录
    </button>
  </nz-form-item>
</form>
<div class="tip">
  账号由管理员在系统中创建。忘记密码？<a routerLink="/passport/reset">用绑定邮箱重置</a>
</div>

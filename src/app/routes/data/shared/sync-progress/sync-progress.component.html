<nz-card nzTitle="同步进度" [nzExtra]="runningTpl">
  @if (progressCard(); as card) {
    <div class="sync-progress">
      <div class="sync-progress__name">{{ card.displayName }}</div>
      <nz-progress
        class="sync-progress__bar"
        nzSize="small"
        [nzPercent]="percentOf(card.done ?? 0, card.total ?? 0)"
        [nzShowInfo]="false"
      />
      <div class="sync-progress__value">
        {{ progressText(card.done ?? 0, card.total ?? 0) }}
      </div>
      <div class="sync-progress__stage text-secondary" [title]="card.stage ?? ''">
        {{ card.stage ?? '—' }}
      </div>
    </div>
  } @else if (queue().queued > 0) {
    <div class="sync-progress__idle text-secondary">
      有 {{ queue().queued }} 个任务排队中，等待开始执行…
    </div>
  } @else {
    <div class="sync-progress__idle text-secondary">当前无任务执行。</div>
  }
</nz-card>

<!-- 并发执行（多消费者）时上面那一条只代表其中之一，这里补个总量，避免「只显示一条」读成「只跑一条」 -->
<ng-template #runningTpl>
  @if (queue().running > 1) {
    <span class="text-sm text-secondary">共 {{ queue().running }} 个执行中</span>
  }
</ng-template>

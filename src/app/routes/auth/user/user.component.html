<page-header title="用户管理" [action]="actionTpl" [autoBreadcrumb]="false" />
<ng-template #actionTpl>
  <button nz-button type="button" (click)="fresh()">刷新</button>
  <button nz-button type="button" nzType="primary" (click)="open()">创建</button>
</ng-template>
<st #st [data]="data()" [columns]="columns" [loading]="loading()">
  <ng-template st-row="avatar" let-item>
    <user-avatar [src]="item.avatar" [name]="item.name" [username]="item.username" size="small" />
  </ng-template>
</st>

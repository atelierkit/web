@if (formData() === null) {
  <nz-spin nzSimple class="block py-lg text-center" />
} @else {
  <sf #sf [schema]="schema" [ui]="ui" [formData]="formData()!" button="none">
    <div class="text-center pt-md">
      <button
        nz-button
        type="button"
        nzType="primary"
        nzSize="large"
        (click)="save(sf.value)"
        [disabled]="!sf.valid"
      >
        保存
      </button>
      <a nz-button type="button" nzSize="large" routerLink="/admin/list">返回</a>
    </div>
  </sf>
}

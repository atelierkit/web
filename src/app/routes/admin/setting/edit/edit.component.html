<page-header [title]="title" [action]="actionTpl" [autoBreadcrumb]="false" />
<ng-template #actionTpl>
  <a nz-button type="button" routerLink="/admin/list">返回列表</a>
</ng-template>

@if (formData() === null) {
  <nz-spin nzSimple class="block py-lg text-center" />
} @else {
  <sf #sf [schema]="schema" [ui]="ui" [formData]="formData()!" button="none">
    <div class="text-center pt-md">
      <button
        nz-button
        type="button"
        nzType="primary"
        nzSize="large"
        (click)="save(sf.value)"
        [disabled]="!sf.valid"
      >
        保存
      </button>
      <button
        nz-button
        type="button"
        nzSize="large"
        nz-popconfirm
        nzPopconfirmTitle="放弃当前修改，并从数据库重新加载？"
        [nzLoading]="loading()"
        [disabled]="!exists()"
        [title]="exists() ? '用数据库中的记录覆盖当前表单' : '数据库中暂无记录，无可重置的内容'"
        (nzOnConfirm)="fresh()"
      >
        重置
      </button>
    </div>
  </sf>
}

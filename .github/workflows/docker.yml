name: 构建并推送镜像

# 提及：镜像默认推送到 GitHub Container Registry（ghcr.io，用内置 GITHUB_TOKEN，无需额外配置）；
# 若要像私有项目那样推阿里云私有仓库，追加一个 docker/login-action 与对应的 secrets 即可。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 安装 Node 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: yarn

      - name: 安装依赖
        # CI 里不需要 husky 的 git hooks
        run: yarn install --frozen-lockfile
        env:
          HUSKY: 0

      - name: 类型检查
        # 与 pre-commit 钩子保持一致：CI 里显式跑一遍，避免有人跳过本地钩子
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: 代码检查
        # 只跑 TS 侧 lint；stylelint 带 --fix，不适合在 CI 里改文件
        run: yarn lint:ts

      - name: 安装浏览器
        # 单元测试跑在真实 Chromium 里（@angular/build:unit-test + Playwright）
        run: npx --no-install playwright install --with-deps chromium

      - name: 单元测试
        # 与 pre-commit 钩子保持一致：本地用 --no-verify 跳过钩子的提交在这里被拦下
        run: npx --no-install ng test --watch=false

      - name: 编译源代码
        # 产物 dist/web/browser 会被 Dockerfile 拷进镜像
        run: yarn build

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        # PR 只验证能否构建，不推送
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
